services:
  app:
    build: .
    image: forgeline:local
    env_file: .env
    environment:
      # .env PORT is the host port; inside the container the app always listens on 3000.
      PORT: "3000"
    ports:
      - "${PORT:-8080}:3000"
    volumes:
      - forgeline-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    image: forgeline:local
    command: ["node", "server/worker.js"]
    env_file: .env
    volumes:
      - forgeline-data:/data
    restart: unless-stopped
    depends_on:
      - app

volumes:
  forgeline-data:
