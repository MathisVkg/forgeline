# Configuration comes from environment variables (Portainer stack variables,
# or a .env file next to this file for plain `docker compose`). No env_file.
services:
  app:
    image: ghcr.io/mathisvkg/forgeline:${IMAGE_TAG:-latest}
    pull_policy: always
    environment:
      # The app always listens on 3000 inside the container; PORT is the host port.
      PORT: "3000"
      TZ: ${TZ:-Europe/Brussels}
    ports:
      - "${PORT:-8080}:3000"
    volumes:
      - forgeline-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    # Same image as app (built by the app service).
    image: ghcr.io/mathisvkg/forgeline:${IMAGE_TAG:-latest}
    pull_policy: always
    command: ["node", "server/worker.js"]
    environment:
      UEX_TOKEN: ${UEX_TOKEN:-}
      TZ: ${TZ:-Europe/Brussels}
      WORKER_CRON: ${WORKER_CRON:-17 3 * * *}
    volumes:
      - forgeline-data:/data
    restart: unless-stopped
    depends_on: [app]

volumes:
  forgeline-data:
